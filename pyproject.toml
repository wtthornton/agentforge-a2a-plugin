[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentforge-a2a-plugin"
version = "1.0.0"
description = "Test rig for AgentForge A2A dispatch — depth guard, circular detection, namespace resolution. Deterministic, zero external deps."
requires-python = ">=3.12"
dependencies = []

[project.entry-points."agentforge.plugins"]
a2a = "agentforge_a2a"

[tool.hatch.build.targets.wheel]
packages = ["agentforge_a2a"]

[tool.hatch.build.targets.wheel.force-include]
"agentforge_a2a/plugin.json" = "agentforge_a2a/plugin.json"
"agentforge_a2a/agents/caller_agent/AGENT.md" = "agentforge_a2a/agents/caller_agent/AGENT.md"
"agentforge_a2a/agents/callee_agent/AGENT.md" = "agentforge_a2a/agents/callee_agent/AGENT.md"

[dependency-groups]
dev = ["pytest>=9.0"]
